name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                laravel: ['11.*', '12.*']
                include:
                    - laravel: '11.*'
                      testbench: '9.*'
                    - laravel: '12.*'
                      testbench: '10.*'

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, intl
                  coverage: none

            - name: Cache composer dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/files
                  key: deps-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}

            - name: Drop dev tools unused in CI (laravel/pao is local agent UX)
              run: composer remove --dev laravel/pao --no-update

            - name: Install dependencies
              run: |
                  composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --no-progress

            - name: Run Pest
              run: vendor/bin/pest

    code-style:
        runs-on: ubuntu-latest
        name: Pint

        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Drop dev tools unused in CI
              run: composer remove --dev laravel/pao --no-update

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run Pint
              run: vendor/bin/pint --test

    static-analysis:
        runs-on: ubuntu-latest
        name: PHPStan

        steps:
            - uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Drop dev tools unused in CI
              run: composer remove --dev laravel/pao --no-update

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress
